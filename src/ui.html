<!doctype html><meta charset="utf-8">
<style>
:root{color-scheme:dark;--bg:#11161d;--surface:#171d25;--raised:#1d252e;--hover:#252f39;--line:#303a45;--line-soft:#252e37;--text:#e5e9ec;--muted:#9ba6af;--quiet:#77838d;--accent:#70c8bd;--focus:rgba(112,200,189,.35);--good:#79c6a0;--warn:#d5b578;--bad:#d98b91;--radius:7px;--radius-sm:5px;--space:8px;--ease:150ms ease;--g:#20272f;--l:#303a45;--ac:var(--accent)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bgimg,var(--bg));color:var(--text);font:13px/1.45 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;overflow:hidden}

.glass{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.row{display:flex;align-items:center;gap:8px;min-width:0}

.btn:hover,.btn.on{background:var(--hover);border-color:#52616b}
.btn:active{background:#2b3840}
.btn:disabled{opacity:.48;cursor:default}
.btn.on{color:var(--accent)}
.btn.ic{width:30px;height:30px;min-height:30px;padding:0;display:inline-grid;place-items:center;flex:none}
.icon{width:16px;height:16px;display:block;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:5px;max-width:230px;min-height:24px;padding:2px 8px;border:1px solid var(--line);border-radius:5px;background:#1b222a;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.row input:not([type=checkbox]):not([type=range]),.row select,.settings-main input:not([type=checkbox]):not([type=range]),.settings-main select,.settings-main textarea,.card input:not([type=checkbox]):not([type=range]),.card select,.card textarea{background:#11171d;border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 9px;color:var(--text)}

select{max-width:100%}

.bar input:focus-visible{outline:0}

.bar .brand{width:24px;height:24px}

.menu-wrap{position:relative;flex:none}
.menu{position:absolute;z-index:20;right:0;top:34px;width:min(260px,calc(100vw - 16px));max-height:calc(100vh - 58px);overflow:auto;padding:5px;background:#1a2027;border:1px solid #39444e;border-radius:7px;box-shadow:0 8px 24px #0005}

.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu .menu-label{padding:7px 8px 4px;color:var(--quiet);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.menu hr{border:0;border-top:1px solid var(--line-soft);margin:4px 2px}
.menu[hidden]{display:none}

.tab:hover{background:#20272f}
.tab.act{background:#202a30;border-color:#33444a;color:#f0f3f4}
.tab.paused{color:var(--quiet)}

.tab .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tab .x:hover{opacity:1;background:#3a2c30;color:#f1a7aa}
.side:not(.wide) .t,.side:not(.wide) .x{display:none}
.side:not(.wide):not(.top) .tab{justify-content:center;width:46px}

.side.top .tab .t{font-size:12px}
.side.top .tab[data-id]{border-bottom-color:transparent}
.side.top .tab.act{border-bottom-color:var(--accent)}
.side .tab[data-id]{border-left-width:2px!important}
.side .tab-mark{display:grid;place-items:center;width:20px;height:20px;color:var(--quiet);flex:none}
.side .tab.act .tab-mark{color:var(--accent)}
.side .tab-control{justify-content:center;width:36px;height:30px;min-height:30px;color:var(--muted)}

.side.top .tab-control{width:32px;min-width:32px}

.card{max-height:calc(100vh - 32px);overflow:auto;width:min(600px,94vw);padding:20px;display:flex;flex-direction:column;gap:13px;background:#171d24;border:1px solid #35404a;border-radius:8px;box-shadow:0 16px 48px #0006}

.close-settings{margin-top:8px;align-self:flex-end}

.history-date{margin:12px 0 4px;padding-top:8px;border-top:1px solid var(--line-soft);color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}

.vault-entry{padding:5px 0;border-bottom:1px solid var(--line-soft)}

.tab-mark .icon{width:16px;height:16px}
.preview-card{height:100%;padding:8px;background:#171d24;border:1px solid var(--line);border-radius:5px;overflow:hidden}

.muted{color:var(--muted)}

    const nav=pages.map(([id,label,ic])=>`<button type="button" data-page-link="${id}" aria-current="${settingsPage===id?'page':'false'}" class="${settingsPage===id?'selected':''}">${icon(ic)}<span class="nav-text">${label}</span></button>`).join('');

    $.innerHTML=`<div class="ov"><div class="settings-shell" role="dialog" aria-modal="true" aria-label="Einstellungen"><nav class="settings-nav" aria-label="Einstellungskategorien"><div class="settings-brand">${mark}<strong>Liquid Flow</strong></div>${nav}</nav><main class="settings-main"><label class="sr-only" for="setting-search">Einstellungen durchsuchen</label><input id="setting-search" class="settings-search" type="search" placeholder="Einstellungen durchsuchen" aria-label="Einstellungen durchsuchen"><p id="setting-empty" class="muted" hidden>Keine passenden Einstellungen gefunden.</p>${content}<button class="btn close-settings" id="c">Schließen</button></main></div></div>`;
    const selectPage=id=>{settingsPage=id;$.querySelectorAll('[data-page-link]').forEach(e=>{e.classList.toggle('selected',e.dataset.pageLink===id);e.setAttribute('aria-current',e.dataset.pageLink===id?'page':'false')});$.querySelectorAll('[data-page]').forEach(e=>e.hidden=e.dataset.page!==id);};
    const filterSettings=q=>{const f=q.trim().toLocaleLowerCase();let count=0;$.querySelectorAll('[data-page]').forEach(e=>{const match=!f||e.textContent.toLocaleLowerCase().includes(f);e.hidden=f?!match:e.dataset.page!==settingsPage;if(match)count++});$.querySelectorAll('[data-page-link]').forEach(e=>{const parts=[...$.querySelectorAll(`[data-page="${e.dataset.pageLink}"]`)];e.hidden=!!f&&!parts.some(p=>p.textContent.toLocaleLowerCase().includes(f))});document.getElementById('setting-empty').hidden=!!count;};
    $.querySelectorAll('[data-page-link]').forEach(e=>e.onclick=()=>{document.getElementById('setting-search').value='';selectPage(e.dataset.pageLink);filterSettings('');$.querySelector('.settings-main').scrollTop=0;});
    document.getElementById('setting-search').oninput=e=>filterSettings(e.target.value);
    selectPage(settingsPage);
    $.querySelectorAll('input[type=checkbox]').forEach(e=>e.onchange=()=>set(e.dataset.k,e.checked));
    $.querySelectorAll('[data-s]').forEach(e=>e.onchange=()=>set(e.dataset.s,e.value));
    $.querySelectorAll('[data-r]').forEach(e=>e.onchange=()=>set(e.dataset.r,+e.value));
    c.onclick=()=>send({t:'close_overlay'}); bindBl();
    $.querySelectorAll('[data-ac]').forEach(e=>e.onclick=()=>set('accent',e.dataset.ac));
    $.querySelectorAll('[data-ka]').forEach(e=>e.onclick=()=>{capturing=e.dataset.ka; view();});
    kr.onclick=()=>send({t:'keymap_reset'});
    exb.onclick=()=>{send({t:'ext_install',v:exi.value}); exi.value='';}; exf.onclick=()=>send({t:'ext_pick'}); exd.onclick=()=>send({t:'ext_pick_dir'});
    $.querySelectorAll('[data-et]').forEach(e=>e.onchange=()=>send({t:'ext_toggle',id:e.dataset.et}));
    $.querySelectorAll('[data-er]').forEach(e=>e.onclick=()=>send({t:'ext_remove',id:e.dataset.er}));
    bgp.onclick=()=>send({t:'bg_pick'}); bgc.onclick=()=>send({t:'bg_clear'});
    ttsv.onclick=()=>send({t:'tts_voices'});
    sp.onclick=()=>send({t:'sync_pick'}); uc.onclick=()=>send({t:'update_check'});
    $.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>send({t:'action',id:e.dataset.a})); cd.onclick=()=>send({t:'action',id:'clear_data'});
  }
}
document.addEventListener('pointerdown',e=>{const wrap=document.querySelector('.menu-wrap');if(wrap&&!wrap.contains(e.target)){const menu=document.getElementById('mainmenu'),btn=document.getElementById('menubtn');if(menu&&!menu.hidden){menu.hidden=true;btn.setAttribute('aria-expanded','false');}}});
document.addEventListener('keydown',e=>{
  if(['Control','Shift','Alt','Meta'].includes(e.key)) return;
  if(capturing){ e.preventDefault(); if(e.key!=='Escape') send({t:'keymap',a:capturing,c:combo(e)}); capturing=null; view(); return; }
  const c=combo(e);
  if(S&&S.actions&&S.actions.some(a=>a.combo===c)&&!(R==='palette'&&c==='Ctrl+K')){ e.preventDefault(); send({t:'key',c}); }
  else if(e.key==='Escape'&&['palette','shield','settings','find','history','bookmarks','downloads','vault','tools','leak','profiles','suggest','workspaces','privacy','qr','import'].includes(R)) send({t:'close_overlay'});
});
send({t:'ready'});
</script>
