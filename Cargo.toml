[package]
name = "liquidflow"
version = "0.3.0"
edition = "2021"

[dependencies]
tao = "0.30"
wry = { version = "0.46", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
arti-client = { version = "0.28", default-features = false, features = ["tokio", "rustls", "compression", "geoip", "onion-service-client", "bridge-client", "pt-client"] }
tor-geoip = "0.28"
tor-proto = { version = "0.28", features = ["stream-ctrl"] }
tor-linkspec = "0.28"
ureq = { version = "2", features = ["json", "socks-proxy"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha1 = "0.10"
hmac = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.32"
base64 = "0.22"
sha2 = "0.10"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
hickory-resolver = { version = "0.24", features = ["dns-over-https-rustls", "webpki-roots"] }
tor-rtcompat = { version = "0.28", features = ["tokio", "rustls"] }

[features]
previews = ["dep:webview2-com", "dep:windows"]

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.33", optional = true }
windows = { version = "0.58", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
